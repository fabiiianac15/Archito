<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archito</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="island" id="island" data-state="boot" data-mood="idle">
      <!-- Recogida: una píldora con el personaje y una línea de estado. -->
      <button class="compact" id="compact" type="button" aria-label="Abrir Archito">
        <img class="compact-avatar" src="/src/assets/archito.png" alt="" />
        <span class="compact-text" id="compact-text">Archito</span>
        <span class="compact-dot" aria-hidden="true"></span>
      </button>

      <!-- Abierta: opciones a la izquierda y una vista de tamaño fijo a la derecha. -->
      <main class="panel" id="panel">
        <nav class="rail" role="tablist" aria-label="Secciones">
          <button class="tab is-on" data-view="inicio" role="tab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20h-5.5v-5h-5v5H4z" /></svg>
            <span>Inicio</span>
          </button>
          <button class="tab" data-view="chat" role="tab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9.5L5 20v-4H4z" /></svg>
            <span>Chat</span>
          </button>
          <button class="tab" data-view="camino" role="tab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4h11l-2 4 2 4H8v9z" /></svg>
            <span>Camino</span>
          </button>
          <button class="tab" data-view="bitacora" role="tab">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zm3 4v2h8V8zm0 4v2h6v-2z" /></svg>
            <span>Bitácora</span>
          </button>
          <button class="rail-close" id="close" title="Recoger (Esc)" aria-label="Recoger">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </nav>

        <div class="content">
          <section class="view is-on" id="view-inicio">
            <div class="card hero">
              <img class="avatar" id="avatar" src="/src/assets/archito.png" alt="" />
              <div class="hero-text">
                <div class="hero-top">
                  <strong>Archito</strong>
                  <span class="pill" id="pill">listo</span>
                </div>
                <p id="subtitle">Tu compañero de Arch</p>
                <div class="bar"><div class="bar-fill sev-good" id="home-bar"></div></div>
                <button class="hero-next" id="home-next" type="button">Empezar el camino</button>
              </div>
            </div>
            <div class="card tiles" id="tiles">
              <button class="tile" data-ask="salud"><i class="tile-dot c-ok"></i>Salud</button>
              <button class="tile" data-ask="actualiza el sistema"><i class="tile-dot c-accent"></i>Actualizar</button>
              <button class="tile" data-ask="por qué falló"><i class="tile-dot c-danger"></i>¿Por qué falló?</button>
              <button class="tile" data-ask="va lento"><i class="tile-dot c-warn"></i>Va lento</button>
              <button class="tile" data-ask="no tengo internet"><i class="tile-dot c-violet"></i>Red</button>
              <button class="tile" data-ask="consejo"><i class="tile-dot c-pink"></i>Consejo</button>
            </div>
          </section>

          <section class="view" id="view-chat">
            <div class="messages" id="messages" aria-live="polite"></div>
            <div class="chips" id="chips"></div>
          </section>

          <section class="view" id="view-camino"></section>
          <section class="view" id="view-bitacora"></section>

          <!-- La caja de texto está en todas las vistas: escribir lleva al chat. -->
          <form class="composer" id="composer">
            <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="Pregunta, pega un error o pide una acción…" />
            <button type="submit" class="send" aria-label="Enviar">➜</button>
          </form>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
