<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archito</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Entrada: Archito baja colgado de un hilo, saluda y se mete en la isla. -->
    <div class="intro" id="intro" aria-hidden="true">
      <div class="intro-thread"></div>
      <div class="intro-buddy" id="intro-buddy"></div>
      <div class="intro-bubble" id="intro-bubble">¡Hola! Soy Archito</div>
    </div>

    <div class="island" id="island" data-state="hidden" data-mood="idle">
      <!-- Recogida: una píldora con la cara de Archito y una palabra de estado. -->
      <button class="compact" id="compact" type="button" aria-label="Abrir Archito">
        <span class="compact-avatar" id="compact-avatar"></span>
        <span class="compact-text" id="compact-text">Archito</span>
        <span class="compact-dot" aria-hidden="true"></span>
      </button>

      <main class="panel" id="panel">
        <header class="top">
          <div class="brand">
            <span class="brand-avatar" id="brand-avatar"></span>
            <span class="pill" id="pill">listo</span>
          </div>

          <nav class="tabs" role="tablist" aria-label="Secciones">
            <button class="tab is-on" data-view="inicio" role="tab" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-5.5h-6V20H4z" /></svg>
              <span>Inicio</span>
            </button>
            <button class="tab" data-view="chat" role="tab" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H10l-4.5 4v-4H5z" /></svg>
              <span>Chat</span>
            </button>
            <button class="tab" data-view="camino" role="tab" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V5h10.5l-1.8 3.5 1.8 3.5H6" /></svg>
              <span>Camino</span>
            </button>
            <button class="tab" data-view="bitacora" role="tab" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h11a1 1 0 0 1 1 1v15H7.5A1.5 1.5 0 0 1 6 18.5zM9 8.5h6M9 12h4" /></svg>
              <span>Bitácora</span>
            </button>
          </nav>

          <div class="win">
            <button class="win-btn" id="close" type="button" title="Recoger (Esc)" aria-label="Recoger">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5" /></svg>
            </button>
            <button class="win-btn win-quit" id="quit" type="button" title="Cerrar Archito" aria-label="Cerrar Archito">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v7M7.2 7.2a7 7 0 1 0 9.6 0" /></svg>
              <span class="win-quit-label">¿Cerrar?</span>
            </button>
          </div>
        </header>

        <div class="content">
          <section class="view is-on" id="view-inicio">
            <div class="home">
              <div class="home-buddy" id="home-buddy"></div>
              <div class="home-main">
                <p class="home-hello" id="home-hello">¡Hola!</p>
                <p class="home-sub" id="subtitle">Tu compañero de Arch</p>
                <div class="bar"><div class="bar-fill" id="home-bar"></div></div>
                <button class="home-next" id="home-next" type="button">Empezar el camino</button>
              </div>
            </div>
            <div class="quick" id="tiles">
              <button class="tile" data-ask="salud" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6" /></svg>Salud
              </button>
              <button class="tile" data-ask="actualiza el sistema" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19.5h14" /></svg>Actualizar
              </button>
              <button class="tile" data-ask="por qué falló" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 9.2a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.6M12 17.6v.2" /><circle cx="12" cy="12" r="8.5" /></svg>¿Qué falló?
              </button>
              <button class="tile" data-ask="qué escritorio uso" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="11" rx="1.5" /><path d="M9 19.5h6M12 16v3.5" /></svg>Mi escritorio
              </button>
            </div>
          </section>

          <section class="view" id="view-chat">
            <div class="messages" id="messages" aria-live="polite"></div>
            <div class="chips" id="chips"></div>
          </section>

          <section class="view" id="view-camino"></section>
          <section class="view" id="view-bitacora"></section>
        </div>

        <!-- La caja de texto está en todas las vistas: escribir lleva al chat. -->
        <form class="composer" id="composer">
          <input id="input" type="text" autocomplete="off" spellcheck="false" placeholder="Pregunta, pega un error o pide algo…" />
          <button type="submit" class="send" aria-label="Enviar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" /></svg>
          </button>
        </form>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
