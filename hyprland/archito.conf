# ──────────────────────────────────────────────
# Configuración de Archito para Hyprland
# Copia estas líneas en tu ~/.config/hypr/hyprland.conf
# (o usa `source = ~/ruta/a/archito/hyprland/archito.conf`)
# ──────────────────────────────────────────────

# Atajo global: SUPER + ESPACIO muestra/oculta Archito
bind = SUPER, space, exec, archito

# Layer rules: blur real de Hyprland sobre el panel translúcido.
# El namespace "archito" se declara desde la app con gtk4-layer-shell.
# Estas reglas no cambian los valores globales de tu rice/dotfiles: usan su
# configuración existente de `decoration.blur` y solo habilitan el efecto para
# las dos superficies de Archito.
layerrule = blur, archito
layerrule = ignorealpha 0.01, archito
layerrule = animation slide, archito

# La lengüeta-flecha del borde (dock):
layerrule = blur, archito-dock
layerrule = ignorealpha 0.01, archito-dock

# La ventana es un layer surface (OVERLAY): no necesita windowrulev2,
# pero si usas una versión antigua de Hyprland puedes añadir:
# windowrulev2 = float, class:^(archito.Archito)$
