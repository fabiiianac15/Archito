<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 160" width="780" height="160" role="img" aria-label="Las poses de Archito">
<title>Las poses de Archito</title>
<style>.fill{fill:#1793d1}.limb{fill:none;stroke:#1793d1;stroke-width:3.4;stroke-linecap:round}
.ln{fill:none;stroke:#14111a;stroke-width:1.4;stroke-linecap:round}
g,path,ellipse{transform-box:view-box}
.bob{transform-origin:60px 112px}.arm-l{transform-origin:35px 64px}.arm-r{transform-origin:85px 64px}
.eyes{transform-origin:60px 56px}.brow-l{transform-origin:49px 49px}.brow-r{transform-origin:71px 49px}
text{font-family:"Inter","Segoe UI",Helvetica,Arial,sans-serif}
.p0 .bob{animation:breathe 3.4s ease-in-out infinite}.p0 .eyes{animation:blink2 4s infinite}.p1 .arm-l{animation:wv .42s ease-in-out infinite alternate}.p2 .face{transform:translate(1.4px,-1.6px)}.p2 .arm-r{transform:rotate(-38deg)}.p2 .bob{animation:ponder 1.8s ease-in-out infinite}.p3 .arm-l{transform:rotate(112deg)}.p3 .arm-r{transform:rotate(-112deg)}.p3 .bob{animation:hop .9s cubic-bezier(.3,.9,.4,1) infinite}.p4 .brow-l{transform:rotate(-16deg)}.p4 .brow-r{transform:rotate(16deg)}.p4 .bob{animation:shiver 1.6s ease-in-out infinite}.p5 .bob{animation:breathe 5s ease-in-out infinite}.p5 .zzz text{animation:drift 3s ease-in-out infinite}.p5 .zzz text:nth-child(2){animation-delay:1.5s}
@keyframes breathe{50%{transform:translateY(-1.8px) scaleY(1.012)}}
@keyframes blink2{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
@keyframes wv{from{transform:rotate(92deg)}to{transform:rotate(134deg)}}
@keyframes ponder{50%{transform:rotate(-3deg) translateY(-1px)}}
@keyframes hop{30%{transform:translateY(-11px)}55%{transform:translateY(0) scaleY(.93) scaleX(1.04)}72%{transform:translateY(-3px)}}
@keyframes shiver{0%,70%,100%{transform:translateX(0)}76%,88%{transform:translateX(-1.2px)}82%,94%{transform:translateX(1.2px)}}
@keyframes drift{0%{opacity:0;transform:translate(0,4px)}30%{opacity:1}100%{opacity:0;transform:translate(5px,-8px)}}
</style>
